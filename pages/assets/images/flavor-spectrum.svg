<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="KINETIC LAB 單品豆風味光譜與烘焙曲線分析圖">
  <defs>
    <pattern id="grid-spectrum" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1D222A" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="#0D0F12" />
  <rect width="800" height="450" fill="url(#grid-spectrum)" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#2B323D" stroke-width="1" />

  <!-- Top Title -->
  <text x="40" y="55" font-family="'Space Mono', monospace" font-size="13" fill="#FFFFFF" letter-spacing="2">ROAST SPECTRUM MATRIX // 風味頻譜數據庫</text>
  <text x="560" y="55" font-family="'Space Mono', monospace" font-size="11" fill="#8C96A5">AGTRON COLOR SCALE: 45 - 88</text>
  <line x1="20" y1="72" x2="780" y2="72" stroke="#242932" stroke-width="1" />

  <!-- Radar / Spectrum Charts: 3 Columns -->
  <!-- 1. LIGHT SPECTRUM -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="200" height="280" fill="#14171C" stroke="#3A4250" stroke-width="1" />
    <text x="16" y="26" font-family="'Space Mono', monospace" font-size="12" fill="#FFFFFF">01 / LIGHT ROAST</text>
    <text x="16" y="42" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">ETHIOPIA GEDEB</text>

    <!-- Spectrum Curve Graphic -->
    <path d="M 16 180 C 40 160, 60 70, 90 60 C 130 50, 160 140, 184 180" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="16,180 90,60 184,180" fill="rgba(255,255,255,0.05)" />
    <line x1="16" y1="180" x2="184" y2="180" stroke="#3A4250" stroke-width="1" />

    <!-- Bar Stats -->
    <text x="16" y="210" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">ACIDITY:</text>
    <text x="130" y="210" font-family="'Space Mono', monospace" font-size="10" fill="#FFFFFF">★★★★☆</text>

    <text x="16" y="234" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">BODY:</text>
    <text x="130" y="234" font-family="'Space Mono', monospace" font-size="10" fill="#FFFFFF">★★☆☆☆</text>

    <text x="16" y="258" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">TEMP:</text>
    <text x="130" y="258" font-family="'Space Mono', monospace" font-size="10" fill="#5AF0A4">93.0 °C</text>
  </g>

  <!-- 2. MEDIUM SPECTRUM -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="200" height="280" fill="#14171C" stroke="#3A4250" stroke-width="1" />
    <text x="16" y="26" font-family="'Space Mono', monospace" font-size="12" fill="#FFFFFF">02 / MEDIUM ROAST</text>
    <text x="16" y="42" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">COLOMBIA HUILA</text>

    <!-- Spectrum Curve Graphic -->
    <path d="M 16 180 C 40 140, 70 80, 100 80 C 130 80, 160 140, 184 180" fill="none" stroke="#D4D8DD" stroke-width="2" />
    <polygon points="16,180 100,80 184,180" fill="rgba(212,216,221,0.06)" />
    <line x1="16" y1="180" x2="184" y2="180" stroke="#3A4250" stroke-width="1" />

    <!-- Bar Stats -->
    <text x="16" y="210" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">ACIDITY:</text>
    <text x="130" y="210" font-family="'Space Mono', monospace" font-size="10" fill="#FFFFFF">★★★☆☆</text>

    <text x="16" y="234" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">BODY:</text>
    <text x="130" y="234" font-family="'Space Mono', monospace" font-size="10" fill="#FFFFFF">★★★☆☆</text>

    <text x="16" y="258" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">TEMP:</text>
    <text x="130" y="258" font-family="'Space Mono', monospace" font-size="10" fill="#5AF0A4">91.5 °C</text>
  </g>

  <!-- 3. DARK SPECTRUM -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="200" height="280" fill="#14171C" stroke="#3A4250" stroke-width="1" />
    <text x="16" y="26" font-family="'Space Mono', monospace" font-size="12" fill="#FFFFFF">03 / DARK ROAST</text>
    <text x="16" y="42" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">SUMATRA GAYO</text>

    <!-- Spectrum Curve Graphic -->
    <path d="M 16 180 C 40 180, 80 140, 120 70 C 150 90, 170 140, 184 180" fill="none" stroke="#8C96A5" stroke-width="2" />
    <polygon points="16,180 120,70 184,180" fill="rgba(140,150,165,0.06)" />
    <line x1="16" y1="180" x2="184" y2="180" stroke="#3A4250" stroke-width="1" />

    <!-- Bar Stats -->
    <text x="16" y="210" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">ACIDITY:</text>
    <text x="130" y="210" font-family="'Space Mono', monospace" font-size="10" fill="#FFFFFF">★☆☆☆☆</text>

    <text x="16" y="234" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">BODY:</text>
    <text x="130" y="234" font-family="'Space Mono', monospace" font-size="10" fill="#FFFFFF">★★★★★</text>

    <text x="16" y="258" font-family="'Space Mono', monospace" font-size="10" fill="#8C96A5">TEMP:</text>
    <text x="130" y="258" font-family="'Space Mono', monospace" font-size="10" fill="#5AF0A4">88.5 °C</text>
  </g>

  <!-- Bottom Indicator -->
  <text x="40" y="412" font-family="'Space Mono', monospace" font-size="11" fill="#555E6C">KINETIC FLAVOR MATRIX // CALIBRATED ON LAB PROTOCOL 2026</text>
</svg>

